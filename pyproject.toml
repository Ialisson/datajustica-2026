[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "datajustica"
version = "0.2.0"
description = "Plataforma reproduzível para análise exploratória de indicadores criminais abertos no Brasil"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pandas>=2.2,<4",
  "plotly>=6,<7",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pyarrow>=18,<25",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
research = ["jupyterlab>=4.2,<5", "statsmodels>=0.14,<1", "scikit-learn>=1.5,<2"]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.9,<1"]

[project.scripts]
datajustica = "datajustica.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datajustica"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["datajustica"]
branch = true
